services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: sapal-obras-postgis
    environment:
      POSTGRES_DB: sapal_obras
      POSTGRES_USER: sapal
      POSTGRES_PASSWORD: sapal
    ports:
      - "5432:5432"
    volumes:
      - sapal_obras_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  sapal_obras_pgdata:
